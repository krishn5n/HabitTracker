spring.application.name=HabitTracker

spring.datasource.url=jdbc:h2:file:./data/habittracker;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
app.jwt.expiration-minutes=60

app.webauthn.rp-id=localhost
app.webauthn.rp-name=Habit Tracker
app.webauthn.origin=http://localhost:8080
