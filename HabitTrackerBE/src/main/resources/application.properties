spring.application.name=HabitTracker

spring.datasource.url=jdbc:h2:file:./data/habittracker;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
app.jwt.expiration-minutes=60

app.webauthn.rp-id=localhost
app.webauthn.rp-name=Habit Tracker
app.webauthn.origin=http://localhost:5173

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.data-sync.enabled=${DATA_SYNC_ENABLED:false}
app.data-sync.repo-dir=${DATA_SYNC_REPO_DIR:.}
app.data-sync.data-path=${DATA_SYNC_DATA_PATH:data}
app.data-sync.branch=${DATA_SYNC_BRANCH:master}
app.data-sync.github-repo=${DATA_SYNC_GITHUB_REPO:krishn5n/HabitTracker}
app.data-sync.push-interval-ms=${DATA_SYNC_PUSH_INTERVAL_MS:840000}
