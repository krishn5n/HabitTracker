spring.application.name=HabitTracker

spring.datasource.url=jdbc:h2:file:./data/habittracker;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:change-this-dev-secret-key-must-be-at-least-256-bits-long-for-hs256}
app.jwt.expiration-minutes=60

app.webauthn.rp-id=localhost
app.webauthn.rp-name=Habit Tracker
app.webauthn.origin=http://localhost:5173

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Encrypted snapshot store in a PRIVATE data repository, never the code repository
# (a push to the code repository would trigger a Render redeploy on every sync).
app.data-sync.enabled=${DATA_SYNC_ENABLED:false}
app.data-sync.repo=${DATA_REPO:krishn5n/habittracker-data}
app.data-sync.branch=${DATA_REPO_BRANCH:main}
app.data-sync.path=${DATA_REPO_PATH:snapshots/habittracker.json.enc}
app.data-sync.token=${DATA_REPO_TOKEN:}
app.data-sync.encryption-key=${DATA_ENCRYPTION_KEY:}
app.data-sync.idle-minutes=${DATA_SYNC_IDLE_MINUTES:12}
app.data-sync.hard-minutes=${DATA_SYNC_HARD_MINUTES:30}
app.data-sync.tick-seconds=${DATA_SYNC_TICK_SECONDS:15}
app.data-sync.push-on-shutdown=${DATA_SYNC_PUSH_ON_SHUTDOWN:true}
